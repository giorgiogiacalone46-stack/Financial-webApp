<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanze">
  <meta name="theme-color" content="#0071E3">
  <title>Finanze Personali</title>
  
  <!-- Apple Touch Icon & Manifest -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  
  <!-- Apple Design System Styles -->
  <link rel="stylesheet" href="css/apple-design.css">
</head>
<body>

  <div class="app-shell">
    
    <!-- ============================================================
         1. MacBook / Desktop Sidebar (Fixed Left)
         ============================================================ -->
    <aside class="sidebar">
      
      <!-- Brand Header -->
      <div class="sidebar-header">
        <div class="brand-wrapper">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
          </div>
          <div class="brand-text">
            <h1>Finanze</h1>
            <span>Personal Suite</span>
          </div>
        </div>
      </div>

      <!-- Navigation List -->
      <nav class="sidebar-nav">
        <span class="nav-section-title">Menu Principale</span>
        
        <!-- Dashboard -->
        <button class="nav-item active" data-tab="dashboard">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="9" rx="1"></rect>
              <rect x="14" y="3" width="7" height="5" rx="1"></rect>
              <rect x="14" y="12" width="7" height="9" rx="1"></rect>
              <rect x="3" y="16" width="7" height="5" rx="1"></rect>
            </svg>
          </span>
          <span>Dashboard</span>
        </button>

        <!-- Movimenti -->
        <button class="nav-item" data-tab="movimenti">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"></path>
            </svg>
          </span>
          <span>Movimenti</span>
        </button>

        <!-- Investimenti (Voce Dedicata) -->
        <button class="nav-item" data-tab="investimenti">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
              <polyline points="16 7 22 7 22 13"></polyline>
            </svg>
          </span>
          <span>Investimenti</span>
          <span class="nav-badge">Nuovo</span>
        </button>

        <span class="nav-section-title" style="margin-top: 12px;">Sistema</span>

        <!-- Impostazioni -->
        <button class="nav-item" data-tab="impostazioni">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </span>
          <span>Impostazioni</span>
        </button>
      </nav>

      <!-- Google Sheets Connection Status -->
      <div class="sidebar-footer">
        <div class="sheet-status-card">
          <div class="sheet-status-indicator" title="Connesso"></div>
          <div class="sheet-status-info">
            <span class="sheet-status-name">Finanze-Movimenti</span>
            <span class="sheet-status-desc">Google Sheets DB</span>
          </div>
        </div>
      </div>

    </aside>

    <!-- ============================================================
         2. Main Viewport Area
         ============================================================ -->
    <main class="main-wrapper">
      
      <!-- iPhone Top Bar (Mobile Only) -->
      <header class="mobile-top-bar">
        <div class="mobile-brand">
          <div class="brand-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
          </div>
          <h1>Finanze</h1>
        </div>
        <div class="mobile-sheet-pill">
          <span class="dot"></span>
          <span>Finanze-Movimenti</span>
        </div>
      </header>

      <!-- MacBook / Desktop Header -->
      <header class="main-header">
        <div class="header-left">
          <h2 class="view-title" id="view-title">Dashboard</h2>
          <span class="view-subtitle" id="view-subtitle">Panoramica finanziaria e indicatori chiave</span>
        </div>
        <div class="header-right">
          <span class="date-pill" id="current-date">Oggi</span>
        </div>
      </header>

      <!-- Active Content Container (Empty Skeleton Area) -->
      <section class="main-content" id="main-viewport">
        <!-- Rendered dynamically by app.js -->
      </section>

    </main>

  </div>

  <!-- ============================================================
       3. iPhone Native Bottom Navigation Bar (Mobile Only)
       ============================================================ -->
  <nav class="mobile-tab-bar">
    <button class="mobile-tab-item active" data-tab="dashboard">
      <div class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1"></rect>
          <rect x="14" y="3" width="7" height="5" rx="1"></rect>
          <rect x="14" y="12" width="7" height="9" rx="1"></rect>
          <rect x="3" y="16" width="7" height="5" rx="1"></rect>
        </svg>
      </div>
      <span>Dashboard</span>
    </button>

    <button class="mobile-tab-item" data-tab="movimenti">
      <div class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"></path>
        </svg>
      </div>
      <span>Movimenti</span>
    </button>

    <button class="mobile-tab-item" data-tab="investimenti">
      <div class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
          <polyline points="16 7 22 7 22 13"></polyline>
        </svg>
      </div>
      <span>Investimenti</span>
    </button>

    <button class="mobile-tab-item" data-tab="impostazioni">
      <div class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </div>
      <span>Impostazioni</span>
    </button>
  </nav>

  <!-- Global Modal Root Container -->
  <div id="modal-container"></div>

  <!-- Chart.js Engine (Local) -->
  <script src="js/vendor/chart.umd.min.js"></script>

  <!-- Application Controller Script (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
