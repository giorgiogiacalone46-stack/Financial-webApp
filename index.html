<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
  <title>Finanze Personali</title>
  
  <!-- Apple Touch Icon & Manifest -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  
  <!-- Apple Design System Styles -->
  <link rel="stylesheet" href="css/apple-design.css?v=2026.18">
</head>
<body>

  <!-- ============================================================
       0. Schermata di Sblocco PIN Stile Apple (Opzionale)
       ============================================================ -->
  <div id="lock-screen-container" class="apple-lock-screen" style="display: none;">
    <div class="lock-brand">
      <div class="lock-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2>Finanze Personali</h2>
      <p>Inserisci il PIN per accedere</p>
    </div>

    <div class="pin-dots-row">
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
    </div>

    <div class="keypad-grid">
      <button class="pin-key" data-val="1">1</button>
      <button class="pin-key" data-val="2">2</button>
      <button class="pin-key" data-val="3">3</button>
      <button class="pin-key" data-val="4">4</button>
      <button class="pin-key" data-val="5">5</button>
      <button class="pin-key" data-val="6">6</button>
      <button class="pin-key" data-val="7">7</button>
      <button class="pin-key" data-val="8">8</button>
      <button class="pin-key" data-val="9">9</button>
      <div class="pin-key empty"></div>
      <button class="pin-key" data-val="0">0</button>
      <button class="pin-key icon-key" data-val="back">⌫</button>
    </div>
  </div>

  <div class="app-shell">
    
    <!-- ============================================================
         1. MacBook / Desktop Sidebar (Fixed Left)
         ============================================================ -->
    <aside class="sidebar">
      
      <!-- Brand Header -->
      <div class="sidebar-header">
        <div class="brand-wrapper">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
          </div>
          <div class="brand-text">
            <h1>Finanze</h1>
            <span>Personal Suite</span>
          </div>
        </div>

      <!-- Navigation List -->
      <nav class="sidebar-nav">
        <span class="nav-section-title">Menu Principale</span>
        
        <!-- Dashboard -->
        <button class="nav-item active" data-tab="dashboard">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              <rect x="14" y="3" width="7" height="5" rx="1"></rect>
              <rect x="14" y="12" width="7" height="9" rx="1"></rect>
              <rect x="3" y="16" width="7" height="5" rx="1"></rect>

          </span>

        <!-- Movimenti -->
        <button class="nav-item" data-tab="movimenti">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"></path>
            </svg>
          </span>
          <span>Movimenti</span>
        </button>

        <!-- Spese & Budget -->
        <button class="nav-item" data-tab="spese">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              <line x1="2" y1="10" x2="22" y2="10"></line>
            </svg>
          </span>
          <span>Spese</span>
        </button>

        <!-- Investimenti -->
        <button class="nav-item" data-tab="investimenti">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
              <polyline points="16 7 22 7 22 13"></polyline>
            </svg>
          </span>
          <span>Investimenti</span>

          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
          </span>
          <span>Storico NW</span>
        </button>

        <span class="nav-section-title" style="margin-top: var(--space-box-gap-sm);">Analisi & Intelligenza</span>

        <!-- Assistente AI -->
        <button class="nav-item" data-tab="assistente">
          <span class="icon" style="color: var(--apple-blue);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"></path>
            </svg>
          </span>
          <span>Assistente</span>
        </button>

        <span class="nav-section-title" style="margin-top: var(--space-box-gap-sm);">Gestione</span>

        <!-- Impostazioni & Configurazione -->

          <span class="icon">

              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>

         2. Main Viewport Area
         ============================================================ -->

        </div>
        <div class="mobile-top-actions">
          <button class="apple-btn-icon privacy-toggle-btn" id="mobile-privacy-toggle-btn" aria-label="Modalità Privacy" title="Modalità Privacy">
            <svg class="icon-eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>

            </svg>
          </button>
          <div class="mobile-sheet-pill" title="Stato Database">
            <span class="dot"></span>
            <span>Finanze</span>
          </div>
        </div>
      </header>

      <!-- MacBook / Desktop Header -->
      <header class="main-header">
        <div class="header-left">
          <h2 class="view-title" id="view-title">Dashboard</h2>
          <span class="view-subtitle" id="view-subtitle">Panoramica finanziaria e indicatori chiave</span>
        </div>
        <div class="header-right">
          <button class="apple-btn-icon privacy-toggle-btn" id="privacy-toggle-btn" aria-label="Modalità Privacy" title="Attiva/Disattiva Modalità Privacy (Nascondi importi)">
            <svg class="icon-eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="icon-eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">

              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
          <span class="date-pill" id="current-date">Oggi</span>
        </div>
      </header>

      <!-- Active Content Container -->
      <section class="main-content" id="main-viewport">
        <!-- Rendered dynamically by app.js -->
      </section>

    </main>

        </svg>

          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
          <polyline points="16 7 22 7 22 13"></polyline>

      </div>
      <span>Investimenti</span>

      <div class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10"></line>
